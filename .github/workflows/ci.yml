name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://mindforge:mindforge@localhost:5432/mindforge
      POSTGRES_USER: mindforge
      POSTGRES_PASSWORD: mindforge
      POSTGRES_DB: mindforge
      APP_SECRET: ci-only-test-secret
      VECTOR_QDRANT_URL: http://localhost:6333
      CACHE_REDIS_URL: redis://localhost:6379
      PYTHONPATH: src
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.3@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
        ports: ["6333:6333"]
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ["6379:6379"]
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: mindforge
          POSTGRES_PASSWORD: mindforge
          POSTGRES_DB: mindforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mindforge -d mindforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mindforge-web/package-lock.json
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: ruff check src/ tests/
      - run: pytest tests/ -v --cov=src/mindforge --cov-report=xml -m "not integration"
      - run: npm ci
        working-directory: mindforge-web
      - run: npm run lint
        working-directory: mindforge-web
      - run: npm run build
        working-directory: mindforge-web
      - run: cp .env.example .env && docker compose config --quiet
