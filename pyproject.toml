[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindforge"
version = "1.0.0"
description = "MindForge — 自适应 Multi-Agent RAG 研究助理系统"
requires-python = ">=3.10"
dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "alembic>=1.14.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "cryptography>=42.0.0",
    # LLM & Embedding
    "openai>=1.30.0",
    "langfuse>=3.0,<4",
    # Vector DB
    "qdrant-client>=1.18.0,<1.19.0",
    # Document Parsing
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    # Retrieval
    "sentence-transformers>=3.0.0",
    "bm25s>=0.1.10",
    "jieba>=0.42.1",
    "scikit-learn>=1.5.0",
    # Cache
    "redis>=5.0.0",
    # Tools
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "tavily-python>=0.7.0",
    # Utils
    "python-dotenv>=1.0.0",
    "paddleocr>=3.0,<4",
    "paddlepaddle>=3.0,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.7.0",
    "httpx>=0.27.0",
]
cpu = ["torch>=2.11.0"]
cu130 = ["torch>=2.11.0"]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
